version: 2

updates:
  # Updates action SHAs and their "# vX.Y.Z" comment automatically.
  # This is what keeps SHA pinning maintainable over time.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dev:
        dependency-type: "development"
      python-prod:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
