name: ci

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a stacked one is checked too.
  pull_request:
  # Lets publish.yml replay the whole CI before releasing to PyPI.
  workflow_call:

# Least privilege: no job below writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Redundant runs are cancelled on PRs, never on main (coverage history).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      # Gates are defined in scripts/check.py, the command the commit hook runs.
      - run: uv run python scripts/check.py ruff format viewer-captures app-captures
        env:
          RUFF_OUTPUT_FORMAT: github
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: uv run python scripts/check.py frontend

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check.py ty

  # Exhaustive range-lineage check (.agents/skills/check-group-precedents),
  # then the six broken variants of refs.py it must catch. About a minute.
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check.py lineage lineage-mutants

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      # Required checks exercise the deterministic application without the AI SDK.
      - run: uv sync --locked
      # No path argument: testpaths (tests/ + src/ doctests) applies.
      - run: >
          uv run pytest -v -m "not ai"
          --cov=src/linexcel
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=junit.xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          files: ./coverage.xml # "file" is deprecated since v5
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The browser tests run twice: at full speed, and on pages slowed four times
  # (tests/conftest.py). A test that reads the page before the page has
  # finished passes at full speed on most runs and fails now and then; slowed,
  # it fails every time, in the pull request that wrote it.
  viewer-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        throttle: ["1", "4"]
    env:
      LINEXCEL_CPU_THROTTLE: ${{ matrix.throttle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.13"
      - run: uv sync --locked --extra screenshots
      - run: uv run playwright install --with-deps chromium
      - run: >
          uv run pytest tests/test_viewer*.py tests/test_app*.py
          tests/test_ui_navigation_polish.py -v -m "not ai"

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` derives the version; a shallow checkout has no tags,
          # so the artifact would be 0.0.0+unknown instead of 1.2.2+dev.N.gSHA.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv build
      
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl python scripts/smoke_distribution.py
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz python scripts/smoke_distribution.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-ok:
    if: always()
    needs: [lint, typecheck, lineage, test, viewer-browser, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "::error::At least one required job failed."
            exit 1
          fi
