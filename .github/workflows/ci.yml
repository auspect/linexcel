name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet à publish.yml de rejouer toute la CI avant de publier sur PyPI.
  workflow_call:

# Principe du moindre privilège : aucun job ci-dessous n'écrit dans le repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On annule les runs redondants sur les PR, jamais sur main (historique de coverage).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # setup-uv v9 a désactivé le pruning par défaut : on le réactive pour ne pas
  # laisser le cache Actions gonfler indéfiniment.
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check --output-format=github src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ty check --ignore unresolved-import src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: >
          uv run pytest tests/ -v
          --cov=src/linexcel
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=junit.xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          files: ./coverage.xml # "file" est déprécié depuis la v5
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv build
      
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl python -c "import linexcel; print(linexcel.__version__)"
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import linexcel; print(linexcel.__version__)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-ok:
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les jobs requis
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "::error::Au moins un job requis a échoué."
            exit 1
          fi
