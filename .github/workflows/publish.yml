name: publish

on:
  push:
    tags: ["v*"]
  # Useful to replay a failed release without re-tagging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # NEVER cancel a release in flight

jobs:
  # Replays lint + typecheck + tests + build before any release.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from `git describe`, which needs the tags
          # and the history behind them. The default shallow checkout has
          # neither, and would build an 0.0.0+unknown wheel.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Releases run on a tag
        run: |
          # A workflow_dispatch replay must select the tag as its ref. Run from
          # a branch and the build is a +dev version, which the consistency
          # check below would reject anyway — but later, and less clearly.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::publish must run on a v* tag, but ref is ${GITHUB_REF_NAME} (${GITHUB_REF_TYPE}). Re-run this workflow selecting the tag as the ref."
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME#v}"

      - run: uv build

      - name: Tag / wheel metadata consistency
        run: |
          expected="${GITHUB_REF_NAME#v}"
          found=$(ls dist/*.whl | head -1 | sed -E 's/.*-([^-]+)-py3.*/\1/')
          if [ "$found" != "$expected" ]; then
            echo "::error::Wheel reports $found but the tag says $expected"
            exit 1
          fi

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl python -c "import linexcel; print(linexcel.__version__)"
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import linexcel; print(linexcel.__version__)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/linexcel
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    # Only tag pushes are releases: a workflow_dispatch replay must not mint a
    # release from a branch name.
    if: github.ref_type == 'tag'
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract changelog section for this version
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          awk -v prefix="## [$v]" '
            $0 ~ /^## / { if (sec) exit; if (index($0, prefix) == 1) sec = 1 }
            sec { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] && echo "found=true" >> "$GITHUB_OUTPUT" || echo "found=false" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "linexcel ${GITHUB_REF_NAME#v}" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "linexcel ${GITHUB_REF_NAME#v}" --generate-notes
          fi
