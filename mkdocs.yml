site_name: linexcel
site_description: Data lineage analysis for Excel workbooks
site_url: https://auspect.github.io/linexcel
repo_url: https://github.com/auspect/linexcel
repo_name: auspect/linexcel

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide:
      - Quick start: guide/quickstart.md
      - Command line: guide/cli.md
      - Lineage coverage: guide/coverage.md
      - HTML export: guide/html.md
      - Workbook context & screenshots: guide/context.md
      - Choosing an AI provider: guide/providers.md
      - AI documentation: guide/ai.md
      - Languages: guide/languages.md
      - Data handling: guide/data-handling.md
  - API Reference:
      - result: api/result.md
      - analyzer: api/analyzer.md
      - aidoc: api/aidoc.md
      - i18n: api/i18n.md
      - refs: api/refs.md
      - vba: api/vba.md
      - external: api/external.md
      - powerquery: api/powerquery.md
      - insights: api/insights.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html
