[[repos]]
repo = "local"
hooks = [
  # Ruff comes from the project's own environment, not from the mirror repo:
  # the mirror pins a version of its own, which drifts away from the one in
  # uv.lock every time Dependabot bumps it, and the hook then formats a file
  # differently from the CI that checks it. Same reasoning as ty below.
  { id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check --fix",
    language = "system",
    types_or = ["python", "pyi"] },
  { id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format",
    language = "system",
    types_or = ["python", "pyi"] },
  # Type check with ty (also enforced in CI).
  { id = "ty-check",
    name = "ty check",
    entry = "uv run ty check --ignore unresolved-import src/",
    language = "system",
    pass_filenames = false,
    types_or = ["python", "pyi",] },
    { id = "pytest",
    name = "pytest",
    entry = "uv run pytest -x -q -m 'not slow'",
    language = "system",
    pass_filenames = false,
    always_run = true,
    },
  # Only fires when the viewer itself changes, and only *checks* — capturing
  # needs Playwright and a generated report, which no ordinary commit should
  # have to install. It fails with the two commands that fix it.
  { id = "readme-shots",
    name = "README screenshots match the viewer",
    entry = "uv run python scripts/capture_viewer.py --check",
    language = "system",
    pass_filenames = false,
    files = '^src/linexcel/(viewer|i18n)\.py$' }
]
