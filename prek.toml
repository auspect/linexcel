# Each gate runs through scripts/check.py, the command CI runs, so the hook and
# CI cannot drift apart (tests/test_check_gates.py). Tools come from uv.lock,
# not from mirror repositories that pin versions of their own.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run python scripts/check.py ruff"
language = "system"
pass_filenames = false
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run python scripts/check.py format"
language = "system"
pass_filenames = false
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ty-check"
name = "ty check"
entry = "uv run python scripts/check.py ty"
language = "system"
pass_filenames = false
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "lineage"
name = "range lineage, exhaustive quick check"
entry = "uv run python scripts/check.py lineage"
language = "system"
pass_filenames = false
types_or = ["python", "pyi"]

# Faster than CI on purpose: CI also runs the slow tests, on every Python version.
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest -x -q -m 'not slow and not ai'"
language = "system"
pass_filenames = false
always_run = true

# The capture checks only hash files: no browser, no generated report.
[[repos.hooks]]
id = "readme-shots"
name = "README screenshots match the viewer"
entry = "uv run python scripts/check.py viewer-captures"
language = "system"
pass_filenames = false
files = '^(src/linexcel/(assets/viewer\.html|(viewer|i18n)\.py)|scripts/capture_viewer\.py|validation_workbooks\.py|imgs/(viewer_.*|manifest\.json))$'

[[repos.hooks]]
id = "app-shots"
name = "README screenshots match the application"
entry = "uv run python scripts/check.py app-captures"
language = "system"
pass_filenames = false
files = '^(src/linexcel/assets/app\.html|scripts/capture_app\.py|validation_workbooks\.py|imgs/app_.*)$'
