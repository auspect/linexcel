# Each gate runs through scripts/check.py, the command CI runs, so the hook and
# CI cannot drift apart (tests/test_check_gates.py). Tools come from uv.lock,
# not from mirror repositories that pin versions of their own.
#
# Gate hooks run on every commit with no file pattern: a gate knows which files
# it reads (capture_app.SOURCES, for one), and a copy of that list here went
# stale. Together they take about ten seconds; the capture checks only hash.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run python scripts/check.py ruff"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run python scripts/check.py format"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "ty-check"
name = "ty check"
entry = "uv run python scripts/check.py ty"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "lineage"
name = "range lineage, exhaustive quick check"
entry = "uv run python scripts/check.py lineage"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "readme-shots"
name = "README screenshots match the viewer"
entry = "uv run python scripts/check.py viewer-captures"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "app-shots"
name = "README screenshots match the application"
entry = "uv run python scripts/check.py app-captures"
language = "system"
pass_filenames = false
always_run = true

# Faster than CI on purpose: CI also runs the slow tests, on every Python version.
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest -x -q -m 'not slow and not ai'"
language = "system"
pass_filenames = false
always_run = true
