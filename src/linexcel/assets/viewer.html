
<style>
  /* Every colour is a custom property so the dark theme below can redefine the
     token instead of the rule — and so the JavaScript can read the handful the
     Cytoscape canvas needs (it cannot resolve var() itself). The hue tokens
     mirror the CVD-safe node palette declared as PALETTE in the script. */
  .lin-root {
    --surface: #fcfcfb; --surface2: #ffffff; --paper: #ffffff;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d67;
    --line: #c3c2b7; --hair: #e1e0d9;
    --blue: #2a78d6; --violet: #4a3aa7; --green: #1baf7a;
    --amber: #eda100; --orange: #eb6834; --grey: #898781;
    /* Fixed anchor: the ink laid on a saturated palette fill, both themes. */
    --on-brand: #0b0b0b;
    --code-bg: #f0efec; --chip-bg: #e8f6f0; --chip-line: #bfe7d8;
    --ai-bg: #fbf9ff; --ai-line: #e5dbff; --ai-badge-bg: #efe9ff;
    --ai-badge-line: #d0bfff; --ai-fg: #5f3dc4;
    --legend-bg: rgba(252,252,251,.92);
    --shadow: rgba(11,11,11,.10); --node-border: rgba(11,11,11,.18);
    /* Agreement / disagreement surfaces. Never the only signal: an icon and a
       sentence carry the same verdict, so a CVD reader loses nothing. */
    --ok-bg: #e8f6f0; --ok-line: #9fdcc4; --ok-fg: #0e6b4a;
    --warn-bg: #fdece4; --warn-line: #f0a67f; --warn-fg: #a83c12;
    /* Link ink is darker than --blue: the node fill misses 4.5:1 as text. */
    --link: #1b62b8; --focus: #1f5fbf; --focus-soft: rgba(31,95,191,.22);
    color-scheme: light;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--ink); position: absolute; inset: 0; display: flex;
    flex-direction: column; background: var(--surface); overflow: hidden;
  }
  /* Dark is opt-in, never automatic: the audience works in Excel, which is a
     light application, and a report that opens dark because the reader's OS is
     dark is the wrong default. prefers-color-scheme is deliberately not
     consulted — the toggle flips data-theme on this element and nothing else. */
  .lin-root[data-theme="dark"] {
    --surface: #16161a; --surface2: #1e1e24;
    --ink: #f2f1ee; --ink2: #bcbab4; --muted: #928f89;
    --line: #4c4c55; --hair: #2e2e36;
    --code-bg: #24242c; --chip-bg: #14342b; --chip-line: #235c4a;
    --ai-bg: #1f1b2b; --ai-line: #3a2f5c; --ai-badge-bg: #2b2447;
    --ai-badge-line: #4a3d7a; --ai-fg: #c9b8ff;
    --legend-bg: rgba(22,22,26,.92);
    --shadow: rgba(0,0,0,.55); --node-border: rgba(255,255,255,.28);
    --ok-bg: #10322a; --ok-line: #2a6e57; --ok-fg: #6fe0b6;
    --warn-bg: #3a1f13; --warn-line: #7a3d22; --warn-fg: #ff9d70;
    --link: #79b0f5; --focus: #7fb0ff; --focus-soft: rgba(127,176,255,.28);
    color-scheme: dark;
  }
  .lin-root * { box-sizing: border-box; }
  .lin-root :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* --- top bar: identity | tabs | graph tools ------------------------- */
  .lin-bar {
    display: flex; align-items: center; gap: .45rem 1rem; padding: .45rem .7rem;
    border-bottom: 1px solid var(--hair); background: var(--surface);
    flex-wrap: wrap;
  }
  .lin-id { display: flex; align-items: baseline; gap: .5rem; min-width: 0; }
  .lin-id h1 {
    font-size: .95rem; margin: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .lin-id .stat { color: var(--ink2); font-size: .8rem; white-space: nowrap; }
  .lin-tabs { display: flex; gap: .2rem; flex-wrap: wrap; }
  .lin-tab {
    padding: .3rem .7rem; border: 1px solid transparent; border-radius: 6px;
    background: none; color: var(--ink2); cursor: pointer; font: inherit;
  }
  .lin-tab:hover { background: var(--hair); color: var(--ink); }
  .lin-tab[aria-selected="true"] {
    background: var(--ink); color: var(--surface); font-weight: 600;
  }
  .lin-tab[hidden], .lin-rail .lin-tab[hidden] { display: none; }
  /* Everything right of the tabs. The theme toggle lives here rather than in
     .lin-tools so that hiding the graph-only tools cannot take it away. The
     row itself never wraps: the tools wrap *inside* it, which keeps the toggle
     beside them instead of stranding it on a line of its own. */
  .lin-bar-right {
    display: flex; align-items: center; gap: .5rem; flex-wrap: nowrap;
    justify-content: flex-end; margin-left: auto; min-width: 0;
  }
  /* The graph tools float over the canvas, top right, instead of crowding
     the header: the header keeps identity and search, the canvas keeps
     what only makes sense above a graph. */
  .lin-tools {
    position: absolute; top: .6rem; right: .6rem; z-index: 12;
    display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
    justify-content: flex-end;
    background: var(--legend-bg); border: 1px solid var(--hair);
    border-radius: 8px; padding: .3rem;
  }
  .lin-tools[hidden] { display: none; }
  .lin-group { display: inline-flex; gap: .2rem; }
  .lin-tools button, .lin-theme {
    padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface2); color: var(--ink); cursor: pointer; font: inherit;
  }
  .lin-tools button:hover, .lin-theme:hover { border-color: var(--ink2); }
  .lin-tools select {
    padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface2); color: var(--ink); cursor: pointer;
    font: inherit; max-width: 200px;
  }
  .lin-tools select:disabled { cursor: default; opacity: .5; }
  .lin-icon { min-width: 2rem; text-align: center; }
  .lin-theme {
    display: inline-flex; align-items: center; justify-content: center;
    padding: .32rem .45rem; color: var(--ink2);
  }
  .lin-theme svg { width: 16px; height: 16px; display: block; }
  .lin-theme .lin-ico-sun { display: none; }
  .lin-root[data-theme="dark"] .lin-theme .lin-ico-moon { display: none; }
  .lin-root[data-theme="dark"] .lin-theme .lin-ico-sun { display: block; }

  /* --- brand mark: the package signs its report ------------------ */
  .lin-brand {
    display: flex; align-items: center; gap: .45rem;
    font-family: ui-monospace, monospace; font-weight: 700;
  }
  .lin-brand-mark {
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--ink); color: var(--surface);
    display: grid; place-items: center; font-size: .68rem;
  }
  .lin-brand-word { font-size: .92rem; letter-spacing: -.01em; }

  /* --- shell + left rail: views, node-type filters, layout ------- */
  .lin-shell { flex: 1; display: flex; min-height: 0; }
  .lin-rail {
    width: 224px; flex-shrink: 0; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--hair);
    padding: .8rem .6rem; display: flex; flex-direction: column; gap: 1.1rem;
  }
  .lin-rail-label {
    font-size: .64rem; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
    padding: 0 .5rem; margin-bottom: .35rem;
  }
  .lin-rail .lin-tabs { flex-direction: column; align-items: stretch; gap: .15rem; }
  .lin-rail .lin-tab { text-align: left; display: flex; align-items: center; gap: .5rem; }
  .lin-kinds { display: flex; flex-direction: column; gap: .1rem; }
  .lin-kind {
    display: flex; align-items: center; gap: .5rem; width: 100%;
    padding: .28rem .5rem; border: none; border-radius: 6px; background: none;
    color: var(--ink2); cursor: pointer; font: inherit; text-align: left;
  }
  .lin-kind:hover { background: var(--hair); color: var(--ink); }
  .lin-kind-n {
    margin-left: auto; font-size: .72rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .lin-kind[aria-pressed="false"] { opacity: .4; }
  .lin-kind:disabled { cursor: default; opacity: .4; }
  .lin-kind:disabled:hover { background: none; color: var(--ink2); }
  .lin-seg {
    display: inline-flex; border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; background: var(--surface2); margin: 0 .5rem;
    align-self: flex-start;
  }
  .lin-seg button {
    padding: .28rem .55rem; border: none; background: none;
    color: var(--ink2); cursor: pointer; font: inherit; font-size: .8rem;
  }
  .lin-seg button + button { border-left: 1px solid var(--hair); }
  .lin-seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  /* --- search: a control, not a bare input ----------------------------- */
  .lin-search {
    display: inline-flex; align-items: center; gap: .3rem;
    border: 1px solid var(--line); border-radius: 6px; padding: 0 .3rem 0 .45rem;
    background: var(--surface2); color: var(--muted);
  }
  /* The wrapper takes the focus ring so the whole control lights up; the input
     drops its own outline, which would otherwise draw a second box inside. */
  .lin-search:focus-within {
    border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-soft);
  }
  .lin-search input:focus-visible { outline: none; }
  .lin-search svg { width: 14px; height: 14px; display: block; flex-shrink: 0; }
  .lin-search input {
    border: none; outline: none; background: none; font: inherit;
    padding: .3rem 0; width: 190px; color: var(--ink); min-width: 0;
  }
  .lin-search input::-webkit-search-cancel-button,
  .lin-search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .lin-search input:disabled { cursor: default; }
  .lin-search.is-empty { border-color: var(--warn-line); }
  .lin-search-clear {
    border: none; background: none; padding: .2rem; margin: 0; cursor: pointer;
    color: var(--muted); border-radius: 4px; display: inline-flex;
  }
  .lin-search-clear[hidden] { display: none; }
  .lin-search-clear:hover { background: var(--hair); color: var(--ink); }
  .lin-search-status {
    font-size: .74rem; line-height: 1.3; padding: .2rem .55rem; border-radius: 99px;
    white-space: nowrap; background: var(--chip-bg); border: 1px solid var(--chip-line);
    color: var(--ink2);
  }
  .lin-search-status[hidden] { display: none; }
  .lin-search-status.is-empty {
    background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-fg);
    font-weight: 600;
  }

  .lin-main { flex: 1; display: flex; min-height: 0; min-width: 0; position: relative; }
  .lin-main.hidden { display: none; }
  .lin-cy { flex: 1; position: relative; min-width: 0; }
  /* The canvas and its floating toolbar share one positioning parent, so the
     toolbar can sit above the canvas (z-index) without ever landing under the
     Cytoscape layer Cytoscape creates inside #lin-cy. */
  .lin-canvas-area { flex: 1; position: relative; min-width: 0; display: flex; }
  .lin-canvas-area .lin-cy { width: 100%; }
  .lin-legend {
    position: absolute; left: .6rem; bottom: .6rem; display: flex; gap: .6rem;
    flex-wrap: wrap; background: var(--legend-bg);
    border: 1px solid var(--hair); border-radius: 8px; padding: .35rem .6rem;
    font-size: .72rem; color: var(--ink2); max-width: 72%;
  }
  .lin-legend span { display: inline-flex; align-items: center; gap: .3rem; }
  /* The legend is flex, so the UA's `[hidden] { display:none }` cannot reach
     it; an empty legend must stand down on its own (see the zero-node graph). */
  .lin-legend[hidden] { display: none; }
  .lin-sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  /* Legend swatches mirror the canvas shapes (see KIND[].sw). */
  .lin-sw-dot { border-radius: 50%; }
  .lin-sw-diamond { transform: rotate(45deg) scale(.82); border-radius: 2px; }
  .lin-sw-hex { border-radius: 0;
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .lin-sw-oct { border-radius: 0;
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .lin-sw-tag { border-radius: 0;
    clip-path: polygon(0 0, 72% 0, 100% 50%, 72% 100%, 0 100%); }
  .lin-panel {
    width: 440px; flex-shrink: 0; overflow-y: auto; padding: .8rem .9rem 2rem;
    border-left: 1px solid var(--hair); background: var(--surface);
    font-size: .85rem;
  }
  .lin-panel.hidden { display: none; }
  .lin-panel:focus { outline: none; }
  .lin-panel h2 { font-size: .95rem; margin: .3rem 0 .5rem; word-break: break-all; }
  .lin-panel h3 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: .8rem 0 .3rem;
  }
  .lin-panel-head { display: flex; align-items: center; gap: .4rem; }
  .lin-badge { font-size: .7rem; padding: .12rem .5rem; border-radius: 99px; }
  .lin-formula {
    display: block; background: var(--code-bg); border-radius: 6px; padding: .45rem .55rem;
    font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre-wrap;
    word-break: break-all;
  }
  .lin-val { font-size: 1.1rem; font-weight: 600; }

  /* --- value card: what Excel stored vs what linexcel recomputed -------- */
  .lin-vcard {
    border: 1px solid var(--hair); border-radius: 8px; overflow: hidden;
    background: var(--surface2);
  }
  .lin-vcard.is-diff { border-color: var(--warn-line); box-shadow: 0 0 0 1px var(--warn-line); }
  .lin-vcard.is-guarded { border-color: var(--amber); }
  .lin-verdict {
    display: flex; align-items: center; gap: .4rem; padding: .35rem .55rem;
    font-size: .76rem; font-weight: 700; line-height: 1.3;
    background: var(--ok-bg); color: var(--ok-fg);
    border-bottom: 1px solid var(--ok-line);
  }
  .lin-vcard.is-diff .lin-verdict {
    background: var(--warn-bg); color: var(--warn-fg); border-bottom-color: var(--warn-line);
  }
  .lin-verdict svg { width: 15px; height: 15px; display: block; flex-shrink: 0; }
  .lin-vgrid { display: grid; grid-template-columns: 1fr 1fr; }
  .lin-vgrid.is-single { grid-template-columns: 1fr; }
  .lin-reading { padding: .45rem .55rem; min-width: 0; }
  .lin-reading + .lin-reading { border-left: 1px solid var(--hair); }
  .lin-reading-label {
    display: flex; align-items: center; gap: .3rem; margin-bottom: .1rem;
    font-size: .64rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); line-height: 1.3;
  }
  /* The two figures are the point of the panel, so they read as figures:
     large, serifed, side by side — a comparison, not a log line. */
  .lin-reading-val {
    font-family: Georgia, 'Times New Roman', serif; font-size: 1.25rem;
    font-weight: 600; color: var(--ink); overflow-wrap: anywhere;
  }
  /* Formula syntax highlighting: functions, references and numbers are told
     apart by colour, reusing the theme's own tokens so dark mode stays
     legible without a second palette. */
  .lin-tok-fn { color: var(--ai-fg); font-weight: 600; }
  .lin-tok-ref { color: var(--link); }
  .lin-tok-sheet { color: var(--muted); }
  .lin-tok-num { color: var(--warn-fg); }
  .lin-tok-str { color: var(--ok-fg); }
  /* The workbooks a cell reads from, and how far each one was followed. */
  .lin-books { list-style: none; margin: 0; padding: 0; }
  .lin-books li + li { margin-top: .4rem; }
  .lin-book-head { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  .lin-book-name { font-weight: 600; overflow-wrap: anywhere; }
  .lin-book-state {
    font-size: .68rem; color: var(--ink2); background: var(--chip-bg);
    border: 1px solid var(--chip-line); border-radius: 99px; padding: .02rem .4rem;
  }
  .lin-book-path {
    font-family: ui-monospace, monospace; font-size: .7rem; color: var(--muted);
    overflow-wrap: anywhere; margin-top: .1rem;
  }
  /* One row per sampled cell of a stretched group. */
  .lin-vtable { width: 100%; border-collapse: collapse; }
  .lin-vtable th, .lin-vtable td {
    padding: .3rem .5rem; text-align: left; vertical-align: top;
  }
  .lin-vtable thead th {
    font-size: .64rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); line-height: 1.3;
    border-bottom: 1px solid var(--hair); white-space: nowrap;
  }
  .lin-vtable thead th .lin-sw {
    width: 8px; height: 8px; border-radius: 2px; margin-right: .25rem;
  }
  .lin-vtable tbody tr + tr th, .lin-vtable tbody tr + tr td {
    border-top: 1px solid var(--hair);
  }
  .lin-vtable tbody td {
    font-family: ui-monospace, monospace; font-size: .8rem; font-weight: 600;
    color: var(--ink); overflow-wrap: anywhere;
  }
  .lin-vtable .lin-vaddr {
    font-family: ui-monospace, monospace; font-size: .78rem; font-weight: 400;
    color: var(--ink2); white-space: nowrap;
  }
  .lin-vtable tbody tr.is-diff th, .lin-vtable tbody tr.is-diff td {
    background: var(--warn-bg); color: var(--warn-fg);
  }
  /* Nothing on this side to show: a stated absence, kept visibly lighter than
     a figure so it is never mistaken for one. */
  .lin-vnone, .lin-vtable tbody td.lin-vnone {
    font-family: inherit; font-size: .74rem; font-weight: 400; color: var(--muted);
  }
  .lin-step {
    border-left: 3px solid var(--blue); background: var(--surface2);
    border-radius: 0 6px 6px 0; padding: .3rem .5rem; margin: .35rem 0;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .lin-step.lin-final { border-left-color: var(--green); }
  .lin-step.lin-final .lin-op { background: var(--green); }
  .lin-step.lin-final .lin-val { margin-bottom: .2rem; }
  .lin-op {
    font-size: .68rem; font-weight: 700; color: var(--on-brand); background: var(--blue);
    border-radius: 4px; padding: .04rem .35rem; margin-right: .35rem;
  }
  .lin-expr { font-family: ui-monospace, monospace; font-size: .74rem; }
  .lin-in {
    display: inline-block; font-size: .7rem; background: var(--chip-bg);
    border: 1px solid var(--chip-line); border-radius: 4px; padding: .03rem .3rem;
    margin: .15rem .15rem 0 0; font-family: ui-monospace, monospace;
  }
  .lin-in.lit { background: var(--code-bg); border-color: var(--hair); }
  .lin-nav { list-style: none; margin: 0; padding: 0; }
  .lin-nav li { display: flex; justify-content: space-between; gap: .4rem; align-items: center; }
  .lin-nav button {
    border: none; background: none; color: var(--link); cursor: pointer;
    text-align: left; padding: .1rem 0; display: inline-flex; align-items: center;
    gap: .3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit;
  }
  .lin-nav button:hover { text-decoration: underline; }
  .lin-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .lin-ek { font-size: .66rem; color: var(--muted); flex-shrink: 0; }
  .lin-code { background: var(--code-bg); border-radius: 6px; padding: .5rem; font-size: .72rem;
    overflow-x: auto; max-height: 260px; font-family: ui-monospace, monospace; }
  /* One M step runs far wider than a line of VBA, and a step scrolled out of
     sight is a step the reader will not check. Wrapped, never truncated. */
  .lin-code.is-wrapped { white-space: pre-wrap; overflow-wrap: anywhere; }
  .lin-doc { font-size: .82rem; line-height: 1.45; overflow-wrap: break-word; }
  .lin-doc h1,.lin-doc h2,.lin-doc h3 { font-size: .9rem; margin: .4rem 0 .2rem; }
  .lin-doc p { margin: .25rem 0; }
  .lin-doc ul,.lin-doc ol { padding-left: 1.2rem; margin: .25rem 0; }
  .lin-doc code { background: var(--code-bg); padding: .1rem .3rem; border-radius: 3px;
    font-family: ui-monospace, monospace; font-size: .78rem; }
  .lin-doc strong { font-weight: 600; }
  /* AI tables: rendered by _md from pipe syntax. The wrapper scrolls rather
     than letting a wide table push the panel open; cells wrap instead of
     truncating. */
  .lin-mdt { display: block; overflow-x: auto; max-width: 100%; margin: .35rem 0; }
  /* No width: the table sizes to its content, narrow tables stay compact
     and genuinely wide ones engage the wrapper's scroll. */
  .lin-mdt table { border-collapse: collapse; font-size: .76rem; }
  .lin-mdt th, .lin-mdt td {
    border: 1px solid var(--hair); padding: .22rem .5rem;
    vertical-align: top; overflow-wrap: anywhere;
  }
  .lin-mdt thead th {
    font-size: .64rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  .lin-mdt td { font-variant-numeric: tabular-nums; }
  .lin-hint { color: var(--muted); font-size: .76rem; margin: .2rem 0; }
  .lin-close {
    margin-left: auto; border: none; background: none; cursor: pointer;
    font-size: 1rem; color: var(--ink2); line-height: 1; padding: .2rem .3rem;
    border-radius: 4px;
  }
  .lin-close:hover { background: var(--hair); color: var(--ink); }
  .lin-fallback { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 2rem; color: var(--ink2); }
  /* The workbook held no formula-driven cells, so there is nothing to lay out
     or trace. A blank canvas reads as a broken render; this states the absence
     and stands the graph-only chrome down (see boot()). */
  .lin-emptygraph { position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; padding: 2rem; }
  .lin-emptygraph-inner {
    text-align: center; color: var(--ink2); max-width: 30rem;
  }
  .lin-emptygraph-title { color: var(--ink); font-size: 1rem; font-weight: 600; }
  .lin-empty-icon { text-align: center; margin-top: 4rem; color: var(--line); }
  .lin-empty-icon svg { width: 44px; height: 44px; }
  .lin-panel h2.lin-empty-title { text-align: center; margin-top: 1rem; word-break: normal; }
  .lin-empty-desc { text-align: center; line-height: 1.45; padding: 0 .5rem; }
  .lin-overview { flex: 1; overflow-y: auto; padding: 1.4rem clamp(1rem, 4vw, 4rem) 3rem; }
  .lin-overview-inner { max-width: 880px; }
  .lin-overview h2 { font-size: 1.1rem; margin: 0 0 .8rem; }

  // --- node cards ------------------------------------------------------------
  // A card is a label with, when there is something worth saying, a secondary
  // annotation line under it: the formatted value for a constant or a named
  // cell, the folded-cell count for a stretched pattern, the macro kind for
  // VBA, "external · unresolved" for a reference nobody could read. Both
  // lines are pre-truncated and the card sized from them, because Cytoscape
  // sizes a node independently of its label — an overflowing label is what
  // made the dense graphs unreadable.
  var CARD_LINE = 24;

  }

    if (n.kind === 'name') return '📛 ' + n.label;

    if (n.kind === 'query') return '⟳ ' + n.label;

  // The card's second line, or '' when the node has nothing more to say.
  function subLabel(n) {
    if (unresolvedExternal(n)) return _t('external_unresolved');
    if (n.kind === 'group') return '×' + (n.count || 0).toLocaleString(LANG);
    if (n.kind === 'vba') return n.procKind || '';
    if (n.kind === 'misc') return (n.count || 0).toLocaleString(LANG) + ' ' + _t('cells');
    if (n.value !== undefined && n.value !== null) return fmt(n.value);

      return fmt(n.values[0].value);
    return '';
  }

    var sub = subLabel(n);

    var maxLen = 0;
    lines.forEach(function (l) { maxLen = Math.max(maxLen, l.length); });

      label: lines.join('\n'),
      // ~5.6px per 9px sans glyph, plus the card's inner padding.

    if (n.groupCachedAgreement) return n.groupCachedAgreement === 'differ';

  // Narrow the graph to one sheet. Nodes of another sheet are kept — dimmed —

  // Mini-markdown → HTML. Handles **bold**, *italic*, `code`, lists -, headings ###,
  // and pipe tables. Enough for the AI cards, no external dep. Escapes & < >
  // first, so model output can never inject markup.
  function _md(src) {
    var esc = src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      if (/^##\s/.test(l))  { if (inList) { out.push('</ul>'); inList = false; } out.push('<h2>' + l.slice(3).trim() + '</h2>'); continue; }
      if (/^#\s/.test(l))   { if (inList) { out.push('</ul>'); inList = false; } out.push('<h1>' + l.slice(2).trim() + '</h1>'); continue; }

      var ch = body.charAt(i);

      if (ch === '\\') { esc = true; continue; }
      if (ch === '|') { cells.push(cur.trim()); cur = ''; continue; }
      cur += ch;

  // Mini syntax highlighting for a formula: functions, references (with their
  // sheet prefix), numbers and string literals each get a colour. The text is
  // escaped first, so a workbook string can never inject markup; the regex
  // then walks the escaped text in one pass — entities it introduces contain
  // no quotes, digits-after-letters or identifier-followed-by-'(', so they
  // cannot match a pattern themselves.
  function highlightFormula(src) {
    var esc = String(src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var re = /("(?:[^"]|"")*")|((?:'[^']+'|[A-Za-z_][\w.]*|\[[^\]]*\][\w. ]*)!)?(\$?[A-Za-z]{1,3}\$?\d+(?::\$?[A-Za-z]{1,3}\$?\d+)?)|([A-Za-z_][\w.]*)(?=\()|(\d+(?:[.,]\d+)?\b)/g;

      if (str) return '<span class="lin-tok-str">' + str + '</span>';
      if (ref) return (sheet ? '<span class="lin-tok-sheet">' + sheet + '</span>' : '')
        + '<span class="lin-tok-ref">' + ref + '</span>';
      if (fn) return '<span class="lin-tok-fn">' + fn + '</span>';
      if (num) return '<span class="lin-tok-num">' + num + '</span>';

    });
  }

  function renderPanel(cy, n) {

    var head = el('div', 'lin-panel-head');
    var badgeLabel = (KIND[n.kind] || {}).labelKey ? _t(KIND[n.kind].labelKey) : n.kind;

    head.appendChild(badge);
    var close = el('button', 'lin-close', '✕');

      fcode.innerHTML = highlightFormula(n.formula);
      sf.appendChild(fcode);
      if (n.kind === 'group') {
        sf.appendChild(el('p', 'lin-hint',
          _t('stretched_pattern', { count: n.count.toLocaleString(LANG), bbox: n.bbox })));
        sf.appendChild(el('code', 'lin-formula', n.r1c1));
      }
      p.appendChild(sf);
      p.appendChild(valueSection(n));
    }
    if (n.kind === 'input' && n.values && n.values.length) {
      var si = section(_t('value_samples'));
      n.values.forEach(function (s) {
        si.appendChild(el('div', 'lin-hint', s.addr + ' = ' + fmt(s.value)));
      });
      if (n.count > n.values.length)
        si.appendChild(el('div', 'lin-hint', '… ' + n.count.toLocaleString(LANG) + ' ' + _t('cells')));
      p.appendChild(si);
    }
    if (n.kind === 'name' && n.targets) {
      var sn = section(_t('target')); sn.appendChild(el('code', 'lin-formula', n.targets.join(' ; ')));
      p.appendChild(sn);
      if (n.value !== undefined && n.value !== null) p.appendChild(valueSection(n));
    }
    if (n.steps && (n.steps.children && n.steps.children.length || (n.steps.inputs && n.steps.inputs.length))) {
      var ss = section(_t('step_decomp'));
      ss.appendChild(el('p', 'lin-hint', _t('step_hint')));
      renderStep(ss, n.steps, 0);
      p.appendChild(ss);
    }
    if (n.externalBooks && n.externalBooks.length) p.appendChild(externalSection(n));
    if (n.kind === 'vba') {
      var sc = section(n.procKind + ' — module ' + n.module);
      sc.appendChild(el('pre', 'lin-code', n.code || '')); p.appendChild(sc);
    }
    if (n.kind === 'query') p.appendChild(querySection(n));
    if (n.doc) {
      var sd = el('div', 'lin-ai-box');
      var badge = el('span', 'lin-ai-badge', _t('ai_doc'));
      sd.appendChild(badge);
      var dv = el('div', 'lin-doc');
      dv.innerHTML = _md(n.doc);
      sd.appendChild(dv); p.appendChild(sd);
    }
    appendNav(cy, p, _t('precedents'), GRAPH.edges.filter(function (e) { return e.target === n.id; })
      .map(function (e) { return { node: byId[e.source], kind: e.kind }; }));
    appendNav(cy, p, _t('dependents'), GRAPH.edges.filter(function (e) { return e.source === n.id; })
      .map(function (e) { return { node: byId[e.target], kind: e.kind }; }));
  }

  // A query is the one thing in a workbook that produces values with no
  // formula behind them, so the panel has to stand in for the formula: the M
  // source verbatim, the range it lands in, and what it reads. Naming a
  // source is not the same as having read it, and the last line says so.
  function querySection(n) {
    var frag = document.createDocumentFragment();
    var sq = section(_t('query_source'));
    if (n.loadedTo && n.loadedTo.length) {
      var dest = n.loadedTo.map(function (d) {
        return (d.sheet ? d.sheet + '!' : '') + (d.ref || '');
      }).join(' ; ');
      sq.appendChild(el('p', 'lin-hint', _t('query_loaded') + ' ' + dest));
    } else {
      sq.appendChild(el('p', 'lin-hint', _t('query_not_loaded')));
    }
    sq.appendChild(el('pre', 'lin-code is-wrapped', n.code || ''));
    frag.appendChild(sq);
    if (n.sources && n.sources.length) {
      var ss = section(_t('query_reads'));
      var list = el('ul', 'lin-books');
      var outside = false;
      n.sources.forEach(function (s) {
        if (!QUERY_SRC[s.kind]) outside = true;
        var li = el('li');
        var head = el('div', 'lin-book-head');
        var dot = el('span', 'lin-sw');
        dot.style.background = QUERY_SRC[s.kind] || PALETTE.grey;
        head.appendChild(dot);
        head.appendChild(el('span', 'lin-book-name', s.target));
        // The M function, untranslated on purpose: it is what the query
        // literally says, and the reader can search the file for it.
        head.appendChild(el('span', 'lin-book-state', s.function));
        li.appendChild(head);
        list.appendChild(li);
      });
      ss.appendChild(list);
      if (outside) ss.appendChild(el('p', 'lin-hint', _t('query_reads_hint')));
      frag.appendChild(ss);
    }
    return frag;
  }

  // The workbooks this cell reads, and how far each one was followed. A cell
  // whose value lives in another file is only as trustworthy as the reading of
  // that file, so the panel names it, gives its declared path, and says plainly
  // whether it was read, taken from a cache, or never opened.
  function externalSection(n) {
    var sx = section(_t('external_books'));
    var list = el('ul', 'lin-books');
    var unread = false;
    n.externalBooks.forEach(function (book) {
      var state = EXTERNAL_READ[book.read] || EXTERNAL_READ.none;
      if (book.read !== 'folder') unread = true;
      var li = el('li');
      var head = el('div', 'lin-book-head');
      var dot = el('span', 'lin-sw');
      dot.style.background = state.color;
      head.appendChild(dot);
      head.appendChild(el('span', 'lin-book-name', book.name));
      head.appendChild(el('span', 'lin-book-state', _t(state.labelKey)));
      li.appendChild(head);
      if (book.path) li.appendChild(el('div', 'lin-book-path', book.path));
      if (book.file) li.appendChild(el('div', 'lin-book-path', book.file));
      list.appendChild(li);
    });
    sx.appendChild(list);
    if (unread) sx.appendChild(el('p', 'lin-hint', _t('external_hint')));
    return sx;
  }

  // What one cell reads as, column by column. The value the file carries and
  // the value linexcel recomputed are never merged into one figure: which of
  // the two is on screen is the question this tool exists to answer. A column
  // with nothing to show says so — "not stored", "not recalculated" — because
  // an empty cell reads as a rendering bug rather than as a fact.
  function readings(o) {
    // The graph names these valueSource/valueDate, as it does on a node; the
    // range samples say source/date, so both spellings are read.
    var src = o.valueSource || o.source;
    var dateText = o.valueDate || o.date;
    var shown = dateText || fmt(o.value);
    var hasValue = o.value !== undefined && o.value !== null;
    var hasCached = o.cachedValue !== undefined && o.cachedValue !== null;
    var cached = hasCached ? fmt(o.cachedValue) : null;
    // A date cell compares on the date part only: a file-cached datetime string
    // ("2026-08-07 00:00:00") is the same day as valueDate.
    var sameDate = dateText && typeof o.cachedValue === 'string' &&
      o.cachedValue.slice(0, 10) === dateText;
    // Two readings only when they are genuinely two: under 'file' or 'volatile'
    // the displayed value *is* the stored one, and a second identical column
    // would claim a corroboration that never happened.
    var stored = !!STORED_SOURCES[src];
    var comparable = hasValue && hasCached && src === 'engine';
    return {
      source: src, shown: shown, hasValue: hasValue,
      file: stored ? shown : cached,
      calc: (stored || !hasValue) ? null : shown,
      comparable: comparable,
      // The verdict is decided in Python and travels with the node, so the
      // two sides of the report cannot disagree about what a disagreement is.
      // 'format' means the same value written with another locale's
      // separators — 6,7 € against 6.7 € — which is not a divergence.
      // The fallback is for a report written by an older version.
      agreement: o.cachedAgreement ||
        ((!!sameDate || cached === shown) ? 'same' : 'differ'),
      agree: comparable &&
        (o.cachedAgreement ? o.cachedAgreement !== 'differ'
                           : (!!sameDate || cached === shown))
    };
  }

  // The value section. The card lays the two provenances side by side and
  // states the verdict — agreement included, because saying nothing reads as
  // "unknown" rather than as "they match". A stretched group is shown one row
  // per sampled cell: a single figure standing in for 200,000 cells hides the
  // very cell where the pattern broke.
  function valueSection(n) {
    var sv = section(_t('value_heading'));
    var main = readings(n);
    var rows = (n.samples || []).map(function (s) {
      var r = readings(s); r.addr = s.addr; return r;
    });
    var judged = rows.length ? rows : [main];
    var comparable = judged.filter(function (r) { return r.comparable; });
    var card = el('div', 'lin-vcard');
    if (comparable.length) {
      var agree = comparable.every(function (r) { return r.agree; });
      // Same value, other separators: worth saying, and worth not shouting.
      var formatted = agree && comparable.some(function (r) {
        return r.agreement === 'format';
      });
      if (!agree) card.className = 'lin-vcard is-diff';
      var verdict = el('div', 'lin-verdict');
      verdict.appendChild(icon(agree ? 'check' : 'warn'));
      verdict.appendChild(document.createTextNode(
        _t(!agree ? 'value_mismatch' : formatted ? 'value_match_format' : 'value_match')));
      card.appendChild(verdict);
    } else if (main.source === 'fallback') {
      card.className = 'lin-vcard is-guarded';
    }
    card.appendChild(rows.length ? sampleTable(rows) : pairGrid(main));
    sv.appendChild(card);
    if (rows.length) {
      sv.appendChild(el('p', 'lin-hint', _t('sampled_cells', {
        shown: rows.length,
        count: (n.count || rows.length).toLocaleString(LANG)
      })));
    }
    // The provenance sentence speaks of one figure. Over a sample table it
    // would only repeat the column header in the singular, so it is kept for
    // the states a header cannot express: a file reading, or a guarded one.
    var src = SRC[main.source];
    if (src && !(rows.length && main.source === 'engine'))
      sv.appendChild(el('p', 'lin-hint', _t(src.descKey)));
    // Only one column carries a figure: name the reason rather than let the
    // reader take the empty half for a bug or for a disagreement.
    if (!comparable.length && main.source === 'engine')
      sv.appendChild(el('p', 'lin-hint', _t('value_no_cache_desc')));
    return sv;
  }
  // One cell, two columns. Without a recorded provenance neither column can be
  // claimed, so the figure stands alone rather than being attributed.
  function pairGrid(r) {
    var grid = el('div', 'lin-vgrid');
    if (!r.source) {
      grid.className = 'lin-vgrid is-single';
      grid.appendChild(reading(null, r.hasValue ? r.shown : null, null));
      return grid;
    }
    grid.appendChild(reading(_t('value_col_file'), r.file, SRC.file.color,
      _t('value_not_in_file')));
    // Swatched by where the figure came from, not by the column it sits in: a
    // guarded fallback and a value fetched from another workbook are both
    // "not the engine reading this file", and the colour says so.
    grid.appendChild(reading(_t('value_col_calc'), r.calc,
      (SRC[r.source] || SRC.engine).color, notRecalculated(r)));
    return grid;
  }
  // Why the recalculation column is empty. "Volatile" is the sharper answer
  // when there is one: linexcel did not decline, it deliberately abstained.
  function notRecalculated(r) {
    return _t(r.source === 'volatile' ? 'value_volatile' : 'value_not_recalc');
  }
  // The sampled cells of a stretched group, one row each. A row whose two
  // readings disagree is marked on the row itself: the card-level verdict
  // covers the whole sample, and would not say *which* cell drifted.
  function sampleTable(rows) {
    var tbl = el('table', 'lin-vtable');
    var head = el('tr');
    head.appendChild(colHead(_t('value_col_cell'), null));
    head.appendChild(colHead(_t('value_col_file'), SRC.file.color));
    head.appendChild(colHead(_t('value_col_calc'), SRC.engine.color));
    var thead = el('thead'); thead.appendChild(head); tbl.appendChild(thead);
    var body = el('tbody');
    rows.forEach(function (r) {
      var tr = el('tr');
      if (r.comparable && !r.agree) tr.className = 'is-diff';
      var addr = el('th', 'lin-vaddr', r.addr);
      addr.setAttribute('scope', 'row');
      tr.appendChild(addr);
      tr.appendChild(valueCell(r.file, _t('value_not_in_file')));
      tr.appendChild(valueCell(r.calc, notRecalculated(r)));
      body.appendChild(tr);
    });
    tbl.appendChild(body);
    return tbl;
  }
  function colHead(labelText, color) {
    var th = el('th');
    th.setAttribute('scope', 'col');
    if (color) {
      var sw = el('span', 'lin-sw');
      sw.style.background = color;
      th.appendChild(sw);
    }
    th.appendChild(document.createTextNode(labelText));
    return th;
  }
  function valueCell(valueText, missingText) {
    return valueText === null || valueText === undefined
      ? el('td', 'lin-vnone', missingText) : el('td', null, valueText);
  }
  // One labelled figure. The swatch repeats the provenance colour used by the
  // badges and the legend, so the two columns stay told apart at a glance.
  function reading(labelText, valueText, color, missingText) {
    var box = el('div', 'lin-reading');
    if (labelText) {
      var lab = el('div', 'lin-reading-label');
      if (color) {
        var sw = el('span', 'lin-sw');
        sw.style.background = color;
        lab.appendChild(sw);
      }
      lab.appendChild(document.createTextNode(labelText));
      box.appendChild(lab);
    }
    var missing = valueText === null || valueText === undefined;
    box.appendChild(el('div', missing ? 'lin-reading-val lin-vnone' : 'lin-reading-val',
      missing ? (missingText || fmt(null)) : valueText));
    return box;
  }

  function renderStep(parent, s, depth) {
    var d = el('div', 'lin-step' + (depth === 0 ? ' lin-final' : ''));
    d.style.marginLeft = Math.min(depth, 6) * 12 + 'px';
    if (depth === 0) d.appendChild(el('div', 'lin-val', _t('final_result')));
    var head = el('div');
    head.appendChild(el('span', 'lin-op', s.label));
    var expr = el('span', 'lin-expr', s.expr); head.appendChild(expr);
    d.appendChild(head);
    var val = el('div');
    if (s.evaluated) { val.appendChild(document.createTextNode('= '));
      var b = el('b', null, fmt(s.value)); val.appendChild(b); }
    else val.appendChild(el('span', 'lin-hint', _t('not_evaluated')));
    d.appendChild(val);
    (s.inputs || []).forEach(function (inp) {
      if (inp.ref !== undefined) d.appendChild(el('span', 'lin-in', inp.ref + ' = ' + fmt(inp.value)));
      else d.appendChild(el('span', 'lin-in lit', fmt(inp.literal)));
    });
    parent.appendChild(d);
    (s.children || []).forEach(function (c) { renderStep(parent, c, depth + 1); });
  }

  function appendNav(cy, parent, title, items) {
    items = items.filter(function (x) { return x.node; });
    if (!items.length) return;
    var sec = section(title + ' (' + items.length + ')');
    var ul = el('ul', 'lin-nav');
    items.forEach(function (it) {
      var li = el('li');
      var btn = el('button');
      btn.type = 'button';
      var dot = el('span', 'lin-dot');
      dot.style.background = (KIND[it.node.kind] || {}).color || PALETTE.grey;
      btn.appendChild(dot); btn.appendChild(document.createTextNode(it.node.label));
      btn.onclick = (function (id) { return function () {
        select(cy, id);
        // The button that carried focus is about to be replaced: hand focus to
        // the panel so the keyboard path continues and the new content is read.
        document.getElementById('lin-panel').focus();
        cy.animate({ center: { eles: cy.getElementById(id) }, duration: 250 });
      }; })(it.node.id);
      li.appendChild(btn); li.appendChild(el('span', 'lin-ek', it.kind));
      ul.appendChild(li);
    });
    sec.appendChild(ul); parent.appendChild(sec);
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
